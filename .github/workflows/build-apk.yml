name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: setup-node@v4
        with:
          node-version: 18

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Portal Hyundai" "com.automotor.portalhyundai" --web-dir .
          npx cap add android

      - name: Compilar APK en modo Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Portal-Hyundai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
