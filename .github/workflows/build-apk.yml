name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crear proyecto Android con Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Portal Hyundai" "com.automotor.portalhyundai" --web-dir www
          npx cap add android

      - name: Aceptar licencias y compilar APK
        run: |
          yes | sdkmanager --licenses || true
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: Portal-Hyundai-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
