<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Portal Posventa - Automotor</title>

  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Librería TOTP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.1.4/otpauth.umd.min.js"></script>

  <style>
    :root {
      --bg-dark: #051329;
      --bg-gradient: radial-gradient(circle at 50% 0%, #0d274d 0%, #051329 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #0072d8;
      --primary-hover: #005bb5;
      --accent: #00e5ff;
      --danger: #ff4d4d;
      --success: #00e676;
      --warning: #ffb300;
      --text: #ffffff;
      --text-muted: #8fa0bc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 340px;
      height: 340px;
      background-image: url('logo-posventa.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-img {
      width: 86px;
      height: 86px;
      margin: 0 auto 14px;
      display: block;
      object-fit: contain;
      border-radius: 18px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-box {
      position: relative;
    }

    .input-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .input-box input {
      width: 100%;
      height: 48px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0 16px 0 42px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-planes {
      background: linear-gradient(135deg, #0072d8 0%, #00b4d8 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 114, 216, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text);
    }

    .btn-admin {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px dashed var(--card-border);
    }

    .auth-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .data-row:last-child {
      border-bottom: none;
    }

    .data-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .data-val {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .copy-icon {
      cursor: pointer;
      color: var(--accent);
      font-size: 14px;
    }

    .otp-display {
      text-align: center;
      padding: 16px 0;
    }

    .otp-code {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transition: width 1s linear;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 14px;
      display: none;
    }

    .alert-danger {
      background: rgba(255, 77, 77, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      background: #00e676;
      color: #051329;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      z-index: 999;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 12px;
    }

    .admin-table th, .admin-table td {
      padding: 8px 4px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      vertical-align: middle;
    }

    .admin-table th {
      color: var(--text-muted);
    }

    .status-badge {
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
    }

    .status-approved {
      background: rgba(0, 230, 118, 0.15);
      color: var(--success);
    }

    .status-pending {
      background: rgba(255, 193, 7, 0.15);
      color: #ffc107;
    }

    .action-group {
      display: flex;
      gap: 4px;
    }

    .action-btn {
      padding: 6px 8px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn-approve {
      background: var(--success);
      color: #051329;
    }

    .action-btn-pass {
      background: var(--warning);
      color: #051329;
    }

    .action-btn-del {
      background: var(--danger);
      color: #ffffff;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: #0d274d;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .modal-box h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- VISTA 1: INICIO DE SESIÓN TALLERES -->
    <div id="view-login" class="card">
      <div class="header">
        <img src="logo-posventa.png" onerror="this.src='logo-posventa.png.png'" alt="Logo" class="brand-img">
        <h1>POSVENTA AUTOMOTOR</h1>
        <p>Acceso a Plataforma Técnica Hyundai</p>
      </div>

      <div id="login-error" class="alert alert-danger"></div>

      <div class="form-group">
        <label>ID o Nombre de Taller</label>
        <div class="input-box">
          <i class="fa-solid fa-warehouse"></i>
          <input type="text" id="login-id" placeholder="Ej: Taller Central">
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="login-pass" placeholder="••••••••">
        </div>
      </div>

      <button type="button" class="btn btn-primary" onclick="loginTaller()">
        <i class="fa-solid fa-right-to-bracket"></i> Ingresar al Portal
      </button>

      <button type="button" class="btn btn-outline" onclick="mostrarVista('view-register')">
        <i class="fa-solid fa-user-plus"></i> Solicitar Registro
      </button>

      <button type="button" class="btn btn-admin" onclick="mostrarVista('view-admin-login')">
        <i class="fa-solid fa-shield-halved"></i> Panel de Administración
      </button>
    </div>

    <!-- VISTA 2: REGISTRO DE NUEVO TALLER -->
    <div id="view-register" class="card" style="display: none;">
      <div class="header">
        <img src="logo-posventa.png" onerror="this.src='logo-posventa.png.png'" alt="Logo" class="brand-img">
        <h1>SOLICITUD DE ACCESO</h1>
        <p>Registro para Talleres Autorizados</p>
      </div>

      <div id="register-msg" class="alert alert-danger"></div>

      <div class="form-group">
        <label>Nombre del Taller / Responsable</label>
        <div class="input-box">
          <i class="fa-solid fa-wrench"></i>
          <input type="text" id="reg-id" placeholder="Nombre de taller">
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña requerida</label>
        <div class="input-box">
          <i class="fa-solid fa-key"></i>
          <input type="password" id="reg-pass" placeholder="Definir contraseña">
        </div>
      </div>

      <button type="button" class="btn btn-primary" onclick="registrarTaller()">
        <i class="fa-solid fa-paper-plane"></i> Enviar Solicitud
      </button>

      <button type="button" class="btn btn-outline" onclick="mostrarVista('view-login')">
        <i class="fa-solid fa-arrow-left"></i> Volver al Login
      </button>
    </div>

    <!-- VISTA 3: PORTAL PRIVADO (CREDENCIALES, OTP Y PLANES) -->
    <div id="view-portal" class="card" style="display: none;">
      <div class="header">
        <img src="logo-posventa.png" onerror="this.src='logo-posventa.png.png'" alt="Logo" class="brand-img">
        <h1 id="taller-nombre-display">TALLER AUTORIZADO</h1>
        <p>Acceso Oficial Posventa Hyundai</p>
      </div>

      <!-- Credenciales Hyundai -->
      <div class="auth-box">
        <div class="data-row">
          <span class="data-label">Usuario Hyundai:</span>
          <span class="data-val">
            <span>ccc@automotor.com.py</span>
            <i class="fa-regular fa-copy copy-icon" onclick="copiarTexto('ccc@automotor.com.py')"></i>
          </span>
        </div>
        <div class="data-row">
          <span class="data-label">Contraseña Hyundai:</span>
          <span class="data-val">
            <span>Ccc*2026</span>
            <i class="fa-regular fa-copy copy-
